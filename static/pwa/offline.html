<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KiteScout Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Space Grotesk", sans-serif;
        background: #081220;
        color: #e8f1ff;
        padding: 1rem;
      }
      .card {
        max-width: 460px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 14px;
        padding: 1rem;
      }
      p {
        color: #99b6d8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>KiteScout is still available for cached pages. Reconnect to refresh forecasts.</p>
    </div>
  </body>
</html>
